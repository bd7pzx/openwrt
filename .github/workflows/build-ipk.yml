name: Build ESurfingClient IPK

on:
  workflow_dispatch: # 允许你手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Clone OpenWrt Source
        run: |
          # 克隆一个轻量级的源码树，这里以 immortalwrt 为例，它对 MT7981 支持好
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt openwrt
          
      - name: Update & Install Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Import Custom Package
        run: |
          # 将你仓库里的源码文件夹移动到 openwrt/package 目录下
          # 假设你的源码在仓库根目录的 esurfingclient 文件夹
          mkdir -p openwrt/package/custom
          cp -r ../esurfingclient openwrt/package/custom/

      - name: Configure Target
        run: |
          cd openwrt
          # 设置 MT7981 (Filogic) 的目标配置
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_log-01=y" >> .config # 这里的机型根据源码树里的定义改，通用可以选 generic
          echo "CONFIG_PACKAGE_esurfingclient=m" >> .config
          make defconfig

      - name: Build Toolchain & Tools
        run: |
          cd openwrt
          # 这里解决你刚才在本地遇到的 tools 问题
          make tools/install -j$(nproc) || make tools/install -j1 V=s
          make toolchain/install -j$(nproc) || make toolchain/install -j1 V=s

      - name: Compile Package
        run: |
          cd openwrt
          make package/esurfingclient/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esurfingclient-ipk
          path: openwrt/bin/packages/aarch64_cortex-a53/*/esurfingclient*.ipk
