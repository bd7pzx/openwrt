name: Build ESurfingClient IPK

on:
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev file wget curl

      - name: Update & Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Setup Custom Package
        run: |
          # 将根目录下的插件移动到编译系统目录
          mkdir -p package/custom
          cp -r esurfingclient package/custom/

      - name: Configure Target (MT7981)
        run: |
          # 强制写入适合 JCG AX3000M 的架构配置
          echo "CONFIG_TARGET_mediatek=y" > .config
          echo "CONFIG_TARGET_mediatek_filogic=y" >> .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_jcg_log-01=y" >> .config
          # 选中你的插件
          echo "CONFIG_PACKAGE_esurfingclient=m" >> .config
          # 选中必要的依赖，防止编译失败
          echo "CONFIG_PACKAGE_libcurl=y" >> .config
          echo "CONFIG_PACKAGE_libopenssl=y" >> .config
          echo "CONFIG_PACKAGE_ca-bundle=y" >> .config
          
          make defconfig

      - name: Build Tools & Toolchain
        run: |
          # 这一步是解决你本地报错的关键
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: Compile ESurfingClient
        run: |
          # 仅编译你的插件及其依赖项
          make package/custom/esurfingclient/compile V=s

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esurfingclient-mt7981-ipk
          # 这里的路径匹配 aarch64 架构下生成的 ipk
          path: bin/packages/aarch64_cortex-a53/*/esurfingclient*.ipk
